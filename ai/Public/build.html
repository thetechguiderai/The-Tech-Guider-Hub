<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build — The Tech Guider AI</title><link rel="icon" href="./logo.png"><link rel="stylesheet" href="./style.css"><script src="./api.js"></script></head><body class="app build-v2">
<header class="build-top"><a class="brand" href="./chat.html"><img src="./logo.png" alt="">The Tech Guider AI <span>/ Build</span></a><div class="build-top-actions"><span class="ready-dot">● Workspace ready</span><button class="icon-button" id="refresh" aria-label="Refresh preview">↻</button><label class="build-path"><span>⌁</span><input value="/" aria-label="Preview path"></label><button class="icon-button" id="openPreview" aria-label="Open preview">↗</button></div></header>
<main class="build-shell"><aside class="build-assistant"><div class="assistant-head"><div><p class="eyebrow">AI BUILD ASSISTANT</p><h1>Build with Guider</h1></div><button class="icon-button compact" id="clearBuild" aria-label="Clear build chat">×</button></div><div class="build-messages" id="buildMessages" aria-live="polite"></div><section class="change-section" id="changes" hidden><div class="section-head"><b>Code changes</b><button id="revertBuild">Revert</button></div><div id="changedFiles"></div><button id="applyBuild" class="apply-changes">Apply changes <span>↵</span></button></section><form class="build-composer" id="buildForm"><textarea id="buildPrompt" rows="1" placeholder="Ask for a change…" aria-label="Ask Guider to build"></textarea><div><button type="button" class="tiny-icon" id="buildAttach" title="Attach file">⌇</button><button type="button" class="tiny-icon" id="buildVoice" title="Voice input">◉</button><select id="buildModel" aria-label="Choose model"></select><button class="build-send" id="buildBtn" aria-label="Send build request">↑</button></div></form></aside>
<section class="preview-workspace"><nav class="preview-tabs"><button class="active" data-screen="preview">▣ Preview</button><button data-screen="code">&lt;/&gt; Code</button><span></span><button class="git-button" title="GitHub connection unavailable">◉ GitHub</button></nav><div class="preview-stage"><div class="browser-frame" id="browserFrame"><div class="browser-chrome"><i></i><i></i><i></i><span>Your project</span></div><iframe id="builderPreview" title="Live generated website" sandbox="allow-scripts"></iframe><pre id="buildCode" hidden></pre></div></div></section></main>
<footer class="build-bottom"><div class="view-switch"><button class="active" data-screen="code">&lt;/&gt; Code</button><button data-screen="preview">▣ Preview</button></div><div class="viewport-switch"><button class="active" data-view="desktop" title="Desktop">▰</button><button data-view="tablet" title="Tablet">▯</button><button data-view="mobile" title="Mobile">▯</button></div><div class="build-actions"><button id="templateBtn">✧ Template</button><button id="downloadBtn">⇩ Download</button><button id="shareBtn">⇧ Share</button><button id="copyBtn">⌘ Copy</button><button class="deploy" title="Deployment integration is not connected">↗ Deploy</button></div></footer><input id="buildFile" type="file" accept=".txt,.md,.html,.css,.js" hidden>
<script>
const $=s=>document.querySelector(s),frame=$('#builderPreview'),code=$('#buildCode'),messages=$('#buildMessages'),prompt=$('#buildPrompt'),changes=$('#changes'),files=$('#changedFiles');
let html=localStorage.getItem('tg_build_draft')||'<!doctype html><html><head><style>body{margin:0;display:grid;min-height:100vh;place-items:center;background:#0b1020;color:#f8fafc;font-family:system-ui}main{text-align:center;padding:48px}h1{font-size:clamp(38px,7vw,76px);margin:0 0 14px}p{color:#a7b5d1}button{padding:12px 18px;border:0;border-radius:8px;background:#2563eb;color:#fff}</style></head><body><main><p>THE TECH GUIDER AI</p><h1>Build something remarkable.</h1><p>Your live preview is ready for its first prompt.</p><button>Get started</button></main></body></html>';
let previous=html, proposedHtml=html;

function extractHtml(reply){
  if(!reply)return '';
  const fenceMatch=reply.match(/```(?:html)?\s*([\s\S]*?)```/i);
  if(fenceMatch&&fenceMatch[1])return fenceMatch[1].trim();
  const docMatch=reply.match(/(<!doctype html[\s\S]*<\/html>|<html[\s\S]*<\/html>)/i);
  if(docMatch&&docMatch[1])return docMatch[1].trim();
  return reply.replace(/^\s*```(?:html)?\s*|\s*```\s*$/gi,'').trim();
}

function computeDiff(oldStr, newStr){
  const o=oldStr.split('\n'), n=newStr.split('\n');
  const oSet=new Set(o);
  let ins=0, del=0;
  for(const line of n){ if(!oSet.has(line)) ins++; }
  const nSet=new Set(n);
  for(const line of o){ if(!nSet.has(line)) del++; }
  return { ins: ins || 1, del };
}

function draw(){
  frame.srcdoc=html;
  code.textContent=html;
  localStorage.setItem('tg_build_draft',html);
}

function message(role,text){
  const el=document.createElement('article');
  el.className='build-message '+role;
  el.innerHTML=`<small>${role==='user'?'YOU':'GUIDER'}</small><p></p>`;
  el.querySelector('p').textContent=text;
  messages.append(el);
  messages.scrollTop=messages.scrollHeight;
  return el;
}

function fileChanges(diff){
  changes.hidden=false;
  files.innerHTML=`<button class="changed-file"><span>⌘</span><b>index.html</b><em>+${diff.ins} / −${diff.del}</em></button>`;
}

async function models(){
  try{
    const r=await fetch('/api/models',{credentials:'include'}),d=await r.json();
    $('#buildModel').innerHTML=d.models.map(m=>`<option value="${m.id}" ${m.locked?'disabled':''}>${m.locked?'🔒 ':''}${m.name}</option>`).join('');
  }catch{
    $('#buildModel').innerHTML='<option value="guider-flash">Guider Flash</option>';
  }
}

let workspaceUser=null;
let authChecked=false;
async function workspaceAuth(){
  try{
    const d=await fetch('/api/auth/me',{credentials:'include'}).then(r=>r.json());
    workspaceUser=d.user||null;
  }catch{
    workspaceUser=null;
  }finally{
    authChecked=true;
  }
}

$('#buildForm').onsubmit=async e=>{
  e.preventDefault();
  const text=prompt.value.trim();
  if(!text)return;

  if(!workspaceUser){
    if(!authChecked) await workspaceAuth();
    if(!workspaceUser){
      alert('Sign up or sign in to use Build.');
      location.assign('./signup.html?next='+encodeURIComponent(location.pathname));
      return;
    }
  }

  message('user',text);
  prompt.value='';
  const pending=message('assistant','Thinking…');
  $('#buildBtn').disabled=true;
  try{
    const r=await fetch('/api/chat',{
      method:'POST',
      credentials:'include',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        modelId:$('#buildModel').value,
        mode:'buildx',
        message:`Return only a complete responsive HTML document with embedded CSS and JS. Create or revise this website: ${text}. Existing HTML: ${html}`
      })
    });
    const d=await r.json();
    if(!r.ok)throw Error(d.error);
    const cleaned=extractHtml(d.reply);
    previous=html;
    proposedHtml=cleaned;
    const diff=computeDiff(html, proposedHtml);
    frame.srcdoc=proposedHtml;
    code.textContent=proposedHtml;
    pending.querySelector('p').textContent='I prepared the updated page. Review it in Preview, then click "Apply changes" or continue refining.';
    fileChanges(diff);
  }catch(x){
    pending.querySelector('p').textContent=x.message;
  }finally{
    $('#buildBtn').disabled=false;
  }
};

document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-screen]').forEach(x=>x.classList.toggle('active',x.dataset.screen===b.dataset.screen));
  const preview=b.dataset.screen==='preview';
  frame.hidden=!preview;
  code.hidden=preview;
});

document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));
  $('#browserFrame').className='browser-frame '+b.dataset.view;
});

$('#refresh').onclick=draw;

$('#revertBuild').onclick=()=>{
  proposedHtml=html;
  draw();
  changes.hidden=true;
  message('assistant','Reverted to previous draft.');
};

$('#applyBuild').onclick=()=>{
  html=proposedHtml;
  draw();
  changes.hidden=true;
  message('assistant','Changes applied to your local project draft.');
};

$('#downloadBtn').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));
  a.download='the-tech-guider-project.html';
  a.click();
};

$('#copyBtn').onclick=async()=>{
  await navigator.clipboard.writeText(html);
  $('#copyBtn').textContent='✓ Copied';
  setTimeout(()=>$('#copyBtn').textContent='⌘ Copy',1200);
};

$('#shareBtn').onclick=async()=>{
  try{
    const file=new File([html],'project.html',{type:'text/html'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({title:'The Tech Guider Project',files:[file]});
      return;
    }
  }catch{}
  try{
    await navigator.clipboard.writeText(html);
    $('#shareBtn').textContent='✓ Project copied';
  }catch{
    await navigator.clipboard.writeText(location.href);
    $('#shareBtn').textContent='✓ Link copied';
  }
  setTimeout(()=>$('#shareBtn').textContent='⇧ Share',1500);
};

$('#openPreview').onclick=()=>{
  const w=window.open('about:blank','_blank');
  if(w){
    const sFrame=w.document.createElement('iframe');
    sFrame.sandbox='allow-scripts';
    sFrame.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:none;';
    sFrame.srcdoc=proposedHtml||html;
    w.document.body.style.margin='0';
    w.document.body.appendChild(sFrame);
  }else{
    document.querySelectorAll('[data-screen="preview"]').forEach(b=>b.click());
  }
};

$('#buildAttach').onclick=()=>$('#buildFile').click();
$('#buildFile').onchange=async e=>{
  const f=e.target.files[0];
  if(f)prompt.value+=' Attached '+f.name+': '+(await f.text()).slice(0,5000);
};

$('#buildVoice').onclick=()=>{
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!R)return alert('Voice input is supported in Chrome and Edge.');
  const r=new R();
  r.onresult=e=>{prompt.value=e.results[0][0].transcript;prompt.focus();};
  r.start();
};

$('#clearBuild').onclick=()=>{
  messages.innerHTML='';
  message('assistant','Fresh build conversation. What should we make?');
};

$('#templateBtn').onclick=()=>{
  prompt.value='Create a premium landing page for ';
  prompt.focus();
};

workspaceAuth();
models();
draw();
</script></body></html>
