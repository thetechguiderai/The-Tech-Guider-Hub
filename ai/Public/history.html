<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>History — The Tech Guider AI</title>
<link rel="icon" href="./logo.png">
<link rel="stylesheet" href="./style.css">
<script src="./api.js"></script></head>
<body class="app">
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><img src="./logo.png" class="logo-img" alt="logo">The Tech Guider</div>
      <input class="search" placeholder="Search here...">
      <nav class="side-nav">
        <a href="./chat.html"><span>💬</span> Chat</a>
        <a href="./index.html"><span>🏠</span> Home</a>
        <a href="./history.html" class="active"><span>🕒</span> History</a>
        <a href="./explore.html"><span>🧭</span> Explore</a>
        <a href="./wallet.html"><span>👛</span> Wallet</a>
        <a href="./payment-history.html"><span>📄</span> Payment History</a>
        <a href="./plans.html"><span>📋</span> Plans</a>
      </nav>
    </aside>

    <main class="main">
      <div class="page-inner">
        <h1>Chat History</h1>
        <div id="historyList"><p class="empty-note">Loading…</p></div>
      </div>
    </main>
  </div>

<script>
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let allConversations = [];

function render(items) {
  const list = document.getElementById("historyList");
  if (!items || items.length === 0) {
    list.innerHTML = `<p class="empty-note">No conversations found.</p>`;
    return;
  }
  list.innerHTML = items.map(c => `
    <div class="list-card">
      <div>
        <div style="font-weight:600;">${esc(c.title)}</div>
        <div class="meta">${esc(c.model)} • ${esc(c.updated_at)}</div>
      </div>
      <div>
        <a href="./chat.html?c=${encodeURIComponent(c.id)}" class="btn btn-ghost" style="padding:6px 12px;font-size:12px;">Open</a>
        <button class="btn btn-ghost" style="padding:6px 12px;font-size:12px;" data-del="${esc(c.id)}">Delete</button>
      </div>
    </div>`).join("");

  list.querySelectorAll("[data-del]").forEach(btn => {
    btn.addEventListener("click", async () => {
      if (!confirm("Delete this conversation?")) return;
      try {
        await fetch(`/api/conversations/${encodeURIComponent(btn.dataset.del)}`, { method: "DELETE", credentials: "include" });
        load();
      } catch (e) {
        alert(e.message || "Failed to delete.");
      }
    });
  });
}

async function load() {
  const list = document.getElementById("historyList");
  try {
    const res = await fetch("/api/conversations", { credentials: "include" });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    allConversations = data.conversations || [];
    render(allConversations);
  } catch (err) {
    list.innerHTML = `<p class="empty-note">Please <a href="./login.html?next=./history.html" style="color:var(--text);text-decoration:underline;">Sign in</a> to view chat history.</p>`;
  }
}

const searchInput = document.querySelector(".search");
if (searchInput) {
  searchInput.addEventListener("input", e => {
    const q = e.target.value.toLowerCase().trim();
    const filtered = allConversations.filter(c => (c.title || '').toLowerCase().includes(q) || (c.model || '').toLowerCase().includes(q));
    render(filtered);
  });
}

load();
</script>
</body>
</html>
