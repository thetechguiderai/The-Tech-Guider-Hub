<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Code — The Tech Guider AI</title><link rel="icon" href="./logo.png"><link rel="stylesheet" href="./style.css"><script src="./api.js"></script></head><body class="app code-v2"><header class="ide-top"><a href="./chat.html" class="ide-mark"><img src="./logo.png" alt="The Tech Guider AI"></a><nav><button>File</button><button>Edit</button><button>Selection</button><button>View</button><button>Go</button><button>Terminal</button><button>Help</button></nav><label class="global-search">⌕ <input placeholder="Search project"></label><div><button class="integration">⌘ Integration</button><button class="ide-deploy" title="Deployment integration is not connected">↗ Deploy</button></div></header><main class="ide-shell"><aside class="ide-ai"><div class="ide-ai-tabs"><button class="active">◯ Chat</button><button>✧ Design</button></div><div class="ide-response"><p class="eyebrow">✦ THOUGHTS</p><p id="aiReply">Sign in to ask Guider to edit your project. Changes are shown for review before they are applied.</p></div><section class="ide-diff" id="diffCard" hidden><header><b>index.html</b><button id="revertCode">Revert</button></header><pre id="diffPreview"></pre></section><div class="ide-apply" id="applyRow" hidden><span>Edited 1 file <i>+42 −8</i></span><button id="applyCode">Apply changes ↵</button></div><form class="ide-composer" id="codeForm"><textarea id="aiPrompt" rows="2" placeholder="Ask a follow-up…"></textarea><div><select id="codeModel" aria-label="Choose model"></select><button type="button" id="codeAttach" title="Attach file">⌇</button><button type="button" id="codeVoice" title="Voice input">◉</button><button aria-label="Send request">↑</button></div></form></aside><aside class="ide-files"><header><b>EXPLORER</b><button id="newFile" title="New file">＋</button></header><div id="fileTree"></div></aside><section class="ide-editor"><div class="editor-tabbar"><button class="editor-tab active" id="tabName">⌘ index.html <i>×</i></button><button class="new-tab" id="formatBtn">Format</button></div><div class="code-area"><div class="line-numbers" id="lineNumbers"></div><textarea id="codeEditor" spellcheck="false" aria-label="Code editor"></textarea></div><section class="ide-terminal"><header><button>Debug Console</button><button>Outputs</button><button class="active">Terminal</button><button>Problems</button><span></span><button id="clearTerminal">×</button></header><pre id="terminalOutput">The Tech Guider AI workspace ready.
› Edit your project or ask Guider for a change.
› Preview updates are saved locally.</pre></section></section></main><input id="codeFile" type="file" accept=".txt,.md,.html,.css,.js" hidden><script>
const $=s=>document.querySelector(s),editor=$('#codeEditor'),numbers=$('#lineNumbers'),output=$('#terminalOutput');
let before='';

function safeFormat(src, file){
  if(file.endsWith('.json')){
    try{ return JSON.stringify(JSON.parse(src), null, 2); }catch{ return src; }
  }
  const scripts=[];
  let protectedSrc=src.replace(/<(script|style)[^>]*>[\s\S]*?<\/\1>/gi, m=>{
    scripts.push(m);
    return `___BLOCK_${scripts.length-1}___`;
  });
  protectedSrc=protectedSrc.replace(/>\s*<(?![^>]*>)/g, '>\n<');
  return protectedSrc.replace(/___BLOCK_(\d+)___/g, (_,i)=>scripts[i]);
}

function extractHtml(reply){
  if(!reply)return '';
  const fenceMatch=reply.match(/```(?:html)?\s*([\s\S]*?)```/i);
  if(fenceMatch&&fenceMatch[1])return fenceMatch[1].trim();
  const docMatch=reply.match(/(<!doctype html[\s\S]*<\/html>|<html[\s\S]*<\/html>)/i);
  if(docMatch&&docMatch[1])return docMatch[1].trim();
  return reply.replace(/^\s*```(?:html)?\s*|\s*```\s*$/gi,'').trim();
}

function computeDiffStats(oldStr, newStr){
  const o=oldStr.split('\n'), n=newStr.split('\n');
  const oSet=new Set(o);
  let ins=0, del=0;
  for(const line of n){ if(!oSet.has(line)) ins++; }
  const nSet=new Set(n);
  for(const line of o){ if(!nSet.has(line)) del++; }
  return { ins: ins || 1, del };
}

let projectFiles={
  'index.html': localStorage.getItem('tg_code_index') || localStorage.getItem('tg_code_draft') || '<!doctype html>\n<html>\n  <head>\n    <title>My Guider project</title>\n  </head>\n  <body>\n    <main>Start building with The Tech Guider AI.</main>\n  </body>\n</html>',
  'style.css': localStorage.getItem('tg_code_style') || '/* Project Styles */\nbody {\n  margin: 0;\n  font-family: system-ui, sans-serif;\n}\n',
  'app.js': localStorage.getItem('tg_code_js') || '// Application Logic\nconsole.log("Guider project initialized.");\n',
  'package.json': localStorage.getItem('tg_code_pkg') || '{\n  "name": "guider-project",\n  "version": "1.0.0"\n}'
};
let currentFile='index.html';

editor.value=projectFiles[currentFile];

function lines(){
  numbers.textContent=editor.value.split('\n').map((_,i)=>i+1).join('\n');
}

function save(){
  projectFiles[currentFile]=editor.value;
  localStorage.setItem('tg_code_' + currentFile.replace(/[^a-z0-9]/gi, '_'), editor.value);
  if(currentFile==='index.html'){
    localStorage.setItem('tg_code_draft', editor.value);
  }
  lines();
}

function tree(){
  const fileList=['index.html','style.css','app.js','package.json'];
  $('#fileTree').innerHTML=fileList.map(name=>`<button class="tree-file ${name===currentFile?'active':''}" data-name="${name}">◇ ${name}</button>`).join('');
  document.querySelectorAll('.tree-file').forEach(b=>b.onclick=()=>{
    // Save current file before switching
    projectFiles[currentFile]=editor.value;
    localStorage.setItem('tg_code_' + currentFile.replace(/[^a-z0-9]/gi, '_'), editor.value);

    document.querySelectorAll('.tree-file').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    currentFile=b.dataset.name;
    $('#tabName').innerHTML='⌘ '+currentFile+' <i>×</i>';
    editor.value=projectFiles[currentFile] || '';
    lines();
  });
}

async function models(){
  try{
    const r=await fetch('/api/models',{credentials:'include'}),d=await r.json();
    $('#codeModel').innerHTML=d.models.map(m=>`<option value="${m.id}" ${m.locked?'disabled':''}>${m.locked?'🔒 ':''}${m.name}</option>`).join('');
  }catch{
    $('#codeModel').innerHTML='<option value="guider-flash">Guider Flash</option>';
  }
}

let workspaceUser=null;
let authChecked=false;
async function workspaceAuth(){
  try{
    const d=await fetch('/api/auth/me',{credentials:'include'}).then(r=>r.json());
    workspaceUser=d.user||null;
  }catch{
    workspaceUser=null;
  }finally{
    authChecked=true;
  }
}

$('#codeForm').onsubmit=async e=>{
  e.preventDefault();
  const p=$('#aiPrompt').value.trim();
  if(!p)return;

  if(!workspaceUser){
    if(!authChecked) await workspaceAuth();
    if(!workspaceUser){
      alert('Sign up or sign in to use Code.');
      location.assign('./signup.html?next='+encodeURIComponent(location.pathname));
      return;
    }
  }

  $('#aiReply').textContent='Thinking through your requested change…';
  try{
    const r=await fetch('/api/chat',{
      method:'POST',
      credentials:'include',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        modelId:$('#codeModel').value,
        message:`Apply this request to ${currentFile}: ${p}\n\nExisting code:\n${editor.value}`
      })
    });
    const d=await r.json();
    if(!r.ok)throw Error(d.error);
    before=editor.value;
    const next=extractHtml(d.reply);
    const diff=computeDiffStats(before, next);
    $('#diffPreview').textContent=`− Current ${currentFile}\n+ Proposed update ready for review`;
    $('#diffCard').hidden=false;
    $('#applyRow').hidden=false;
    $('#applyRow').querySelector('i').textContent=`+${diff.ins} −${diff.del}`;
    $('#applyCode').onclick=()=>{
      editor.value=next;
      save();
      $('#diffCard').hidden=true;
      $('#applyRow').hidden=true;
      $('#aiReply').textContent=`Applied the update to ${currentFile} and saved it locally.`;
      output.textContent+=`\n✓ Applied Guider change to ${currentFile}.`;
    };
    $('#aiReply').textContent='I prepared a proposed change. Review it below, then apply it to the editor.';
  }catch(x){
    $('#aiReply').textContent=x.message;
  }
};

$('#revertCode').onclick=()=>{
  editor.value=before;
  save();
  $('#diffCard').hidden=true;
  $('#applyRow').hidden=true;
};

editor.oninput=save;
editor.onscroll=()=>numbers.scrollTop=editor.scrollTop;

$('#formatBtn').onclick=()=>{
  editor.value=safeFormat(editor.value, currentFile);
  save();
  output.textContent+=`\n✓ Formatted ${currentFile}.`;
};

$('#newFile').onclick=()=>{
  const name=prompt('File name:');
  if(name && !projectFiles[name]){
    projectFiles[name]='';
    tree();
    // Switch to new file
    const btn=document.querySelector(`[data-name="${name}"]`);
    if(btn) btn.click();
  }
};

$('#clearTerminal').onclick=()=>output.textContent='Terminal cleared.';
$('#codeAttach').onclick=()=>$('#codeFile').click();
$('#codeFile').onchange=async e=>{
  const f=e.target.files[0];
  if(f)$('#aiPrompt').value+=' Attached '+f.name+': '+(await f.text()).slice(0,5000);
};

$('#codeVoice').onclick=()=>{
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!R)return alert('Voice input is supported in Chrome and Edge.');
  const r=new R();
  r.onresult=e=>{$('#aiPrompt').value=e.results[0][0].transcript;};
  r.start();
};

workspaceAuth();
tree();
models();
lines();
</script></body></html>
