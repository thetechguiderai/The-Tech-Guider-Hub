<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explore — The Tech Guider AI</title>
<link rel="icon" href="./logo.png">
<link rel="stylesheet" href="./style.css">
<script src="./api.js"></script></head>
<body class="app">
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><img src="./logo.png" class="logo-img" alt="logo">The Tech Guider</div>
      <input class="search" placeholder="Search here...">
      <nav class="side-nav">
        <a href="./chat.html"><span>💬</span> Chat</a>
        <a href="./index.html"><span>🏠</span> Home</a>
        <a href="./history.html"><span>🕒</span> History</a>
        <a href="./explore.html" class="active"><span>🧭</span> Explore</a>
        <a href="./wallet.html"><span>👛</span> Wallet</a>
        <a href="./payment-history.html"><span>📄</span> Payment History</a>
        <a href="./plans.html"><span>📋</span> Plans</a>
      </nav>
    </aside>

    <main class="main">
      <div class="page-inner">
        <h1>Explore Models</h1>
        <div id="modelsGrid" class="quick-cards" style="grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:12px;"></div>
      </div>
    </main>
  </div>

<script>
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let allModels = [];

function render(items) {
  const grid = document.getElementById("modelsGrid");
  if (!items || items.length === 0) {
    grid.innerHTML = `<p class="empty-note" style="grid-column:1/-1;">No models found matching your search.</p>`;
    return;
  }
  grid.innerHTML = items.map(m => `
    <div class="quick-card">
      <strong>${esc(m.name)} ${m.locked ? "🔒" : ""}</strong>
      <span>${esc(m.desc)}</span>
      <div class="meta" style="margin-top:8px;">${esc((m.tier || '').toUpperCase())}</div>
    </div>`).join("");
}

async function load() {
  const grid = document.getElementById("modelsGrid");
  try {
    const res = await fetch("/api/models", { credentials: "include" });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Failed to load models');
    allModels = data.models || [];
    render(allModels);
  } catch (err) {
    grid.innerHTML = `<p class="empty-note" style="grid-column:1/-1;">Could not load models. Please refresh to try again.</p>`;
  }
}

const searchInput = document.querySelector(".search");
if (searchInput) {
  searchInput.addEventListener("input", e => {
    const q = e.target.value.toLowerCase().trim();
    const filtered = allModels.filter(m => (m.name || '').toLowerCase().includes(q) || (m.desc || '').toLowerCase().includes(q) || (m.tier || '').toLowerCase().includes(q));
    render(filtered);
  });
}

load();
</script>
</body>
</html>
