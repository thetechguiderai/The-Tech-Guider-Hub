<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment History — The Tech Guider AI</title>
<link rel="icon" href="./logo.png">
<link rel="stylesheet" href="./style.css">
<script src="./api.js"></script></head>
<body class="app">
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><img src="./logo.png" class="logo-img" alt="logo">The Tech Guider</div>
      <input class="search" placeholder="Search here...">
      <nav class="side-nav">
        <a href="./chat.html"><span>💬</span> Chat</a>
        <a href="./index.html"><span>🏠</span> Home</a>
        <a href="./history.html"><span>🕒</span> History</a>
        <a href="./explore.html"><span>🧭</span> Explore</a>
        <a href="./wallet.html"><span>👛</span> Wallet</a>
        <a href="./payment-history.html" class="active"><span>📄</span> Payment History</a>
        <a href="./plans.html"><span>📋</span> Plans</a>
      </nav>
    </aside>

    <main class="main">
      <div class="page-inner">
        <h1>Payment History</h1>
        <div id="payList"><p class="empty-note">Loading…</p></div>
      </div>
    </main>
  </div>

<script>
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let allPayments = [];

function render(items) {
  const list = document.getElementById("payList");
  if (!items || items.length === 0) {
    list.innerHTML = `<p class="empty-note">No payments found.</p>`;
    return;
  }
  list.innerHTML = items.map(p => `
    <div class="list-card">
      <div>
        <div style="font-weight:600;">${esc(p.plan)}</div>
        <div class="meta">${esc(p.created_at)}</div>
      </div>
      <div>PKR ${esc(p.final_amount ?? p.amount)} — <span style="text-transform:capitalize;">${esc(p.status)}</span></div>
    </div>`).join("");
}

async function load() {
  const list = document.getElementById("payList");
  try {
    const res = await fetch("/api/payments", { credentials: "include" });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    allPayments = data.payments || [];
    render(allPayments);
  } catch (err) {
    list.innerHTML = `<p class="empty-note">Please <a href="./login.html?next=./payment-history.html" style="color:var(--text);text-decoration:underline;">Sign in</a> to view payment history.</p>`;
  }
}

const searchInput = document.querySelector(".search");
if (searchInput) {
  searchInput.addEventListener("input", e => {
    const q = e.target.value.toLowerCase().trim();
    const filtered = allPayments.filter(p => (p.plan || '').toLowerCase().includes(q) || (p.status || '').toLowerCase().includes(q) || String(p.final_amount ?? p.amount).includes(q));
    render(filtered);
  });
}

load();
</script>
</body>
</html>
