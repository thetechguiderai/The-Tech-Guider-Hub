<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — The Tech Guider AI</title>
<link rel="icon" href="./logo.png">
<link rel="stylesheet" href="./style.css">
<script src="./api.js"></script></head>
<body class="app">
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><img src="./logo.png" class="logo-img" alt="logo">The Tech Guider</div>
      <button class="btn btn-ghost btn-block" style="text-align: left; margin-bottom: 10px;" onclick="location.href='./chat.html'">➕ New Chat</button>
      <nav class="side-nav">
        <a href="./chat.html"><span>💬</span> Chat</a>
        <a href="./build.html"><span>🚀</span> Build Web</a>
        <a href="./history.html"><span>🕒</span> History</a>
        <a href="./explore.html"><span>🧭</span> Explore</a>
        <a href="./wallet.html"><span>👛</span> Wallet</a>
        <a href="./payment-history.html"><span>📄</span> Payment History</a>
        <a href="./plans.html"><span>📋</span> Plans</a>
        <a href="./settings.html" class="active"><span>⚙</span> Settings</a>
      </nav>
    </aside>

    <main class="main">
      <div class="page-inner">
        <h1>Settings</h1>
        <div id="settingsBox" style="max-width:400px;">
            <div class="field"><label>Theme</label>
                <select id="themeSelect" onchange="updateTheme(this.value)">
                    <option value="dark">Dark Mode</option>
                    <option value="light">Light Mode</option>
                </select>
            </div>
            <div id="userSettings"></div>
        </div>
      </div>
    </main>
  </div>

<script>
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function applyTheme(theme) {
  if (theme === 'light') {
    document.body.classList.add('light');
    document.documentElement.classList.add('light');
  } else {
    document.body.classList.remove('light');
    document.documentElement.classList.remove('light');
  }
}

function updateTheme(val) {
  localStorage.setItem('tg_theme', val);
  applyTheme(val);
}

const savedTheme = localStorage.getItem('tg_theme') || 'dark';
const tSelect = document.getElementById("themeSelect");
if (tSelect) tSelect.value = savedTheme;
applyTheme(savedTheme);

async function load() {
  const box = document.getElementById("userSettings");
  try {
    const res = await fetch("/api/auth/me", { credentials: "include" });
    const { user } = await res.json().catch(() => ({}));
    if (!user) {
      box.innerHTML = `<p class="empty-note">Please <a href="./login.html?next=./settings.html" style="color:var(--text);text-decoration:underline;">Sign in</a> to manage profile settings.</p>`;
      return;
    }
    box.innerHTML = `
      <div class="field"><label>Name</label><input id="nameInput" value="${esc(user.name || '')}"></div>
      <div class="field"><label>Email</label><input value="${esc(user.email)}" disabled></div>
      <div class="field"><label>Plan</label><input value="${esc(user.plan)}" disabled></div>
      <button class="btn btn-primary" id="saveBtn">Save changes</button>
      <button class="btn btn-ghost" id="logoutBtn" style="margin-top:10px;">Sign Out</button>
    `;
    document.getElementById("saveBtn").addEventListener("click", async () => {
      const name = document.getElementById("nameInput").value.trim();
      try {
        const r = await fetch("/api/auth/me", {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ name }),
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) {
          alert(d.error || "Profile could not be saved.");
          return;
        }
        alert("Profile saved!");
      } catch (err) {
        alert(err.message || "Network error while saving.");
      }
    });
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await fetch("/api/auth/logout", { method: "POST", credentials: "include" });
      window.location.href = "./index.html";
    });
  } catch {
    box.innerHTML = `<p class="empty-note">Please <a href="./login.html?next=./settings.html" style="color:var(--text);text-decoration:underline;">Sign in</a> to manage profile settings.</p>`;
  }
}
load();
</script>
</body>
</html>
